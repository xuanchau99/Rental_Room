name: Build and integration tests
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven and PostgreSQL integration tests
        run: bash ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage
          path: |
            target/surefire-reports
            target/site/jacoco
      - name: Build and start the full Docker stack
        run: docker compose up -d --build --wait
      - name: Verify application and PostgreSQL
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/v3/api-docs
          docker compose exec -T postgres psql -U rental -d rental_room -c "SELECT COUNT(*) FROM rooms" | tee /tmp/room-count.txt
          grep -Eq '^[[:space:]]*9[[:space:]]*$' /tmp/room-count.txt
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop Docker stack
        if: always()
        run: docker compose down
