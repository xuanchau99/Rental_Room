services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_management
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rental_local}
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d home_management"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/home_management?sslmode=disable}
      DB_USERNAME: ${DB_USERNAME:-rental}
      DB_PASSWORD: ${DB_PASSWORD:-rental_local}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-key-change-before-deployment-2026}
      BANK_BIN: ${BANK_BIN:-}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-}
      BANK_NAME: ${BANK_NAME:-}
      METER_IMAGES_ROOT: /app/data/meter-images
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "127.0.0.1:8080:${SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - meter_images:/app/data/meter-images
volumes:
  postgres_data:
  meter_images:
