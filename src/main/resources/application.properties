spring.application.name=home_management
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/home_management}
spring.datasource.username=${DB_USERNAME:rental}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD}
app.jwt.secret=${JWT_SECRET}
server.port=${SERVER_PORT:8080}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
springdoc.api-docs.enabled=${APP_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_API_DOCS_ENABLED:false}
app.images.root=${METER_IMAGES_ROOT:./data/meter-images}
app.bank.bin=${BANK_BIN:}
app.bank.account=${BANK_ACCOUNT:}
app.bank.name=${BANK_NAME:}
app.pdf.font=${APP_PDF_FONT:}
